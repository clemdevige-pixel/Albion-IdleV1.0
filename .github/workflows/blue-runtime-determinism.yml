name: Blue Runtime Determinism

on:
  push:
    branches:
      - agent/albion-idle-development
  pull_request:
    branches:
      - agent/albion-idle-development

jobs:
  blue-runtime-determinism:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Blue runtime determinism
        run: pnpm exec tsx scripts/runtime-blue-deterministic-check.ts

      - name: Verify defensive equipment balance contract
        run: |
          pnpm --filter @game/gameplay test -- equipment-stat-rounding.test.ts
          pnpm --filter @game/client test -- defensiveEquipmentBalance.test.ts

      - name: Fresh-run onboarding diagnostics
        run: |
          pnpm --filter @game/client test -- t3OnboardingBenchmark.test.ts --reporter=verbose
          pnpm --filter @game/client test -- enchantmentShardTtkBenchmark.test.ts --reporter=verbose
          pnpm exec tsx --tsconfig tsconfig.base.json scripts/runtime-blue-progression-farm-run.ts
          python - <<'PY'
          import csv, collections
          p='node_modules/.cache/albion-idle/runtime-blue-persistent-progression-farm.csv'
          totals=collections.defaultdict(float)
          milestones=collections.defaultdict(dict)
          with open(p,newline='',encoding='utf-8') as f:
              for r in csv.DictReader(f):
                  key=(r['mode'],r['specialization'].replace('mastery_',''))
                  totals[key]+=float(r['elapsedSeconds'])
                  z=r['zone']; s=int(r['segment'])
                  if s==10:
                      milestones[key][z]=round(totals[key],1)
          print('[BLUE_COMBAT_ELAPSED_SUMMARY]')
          for key,total in sorted(totals.items()):
              print(key, 'totalSeconds=',round(total,1),'milestones=',milestones[key])
          PY
