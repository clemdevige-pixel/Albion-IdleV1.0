name: TEMP Blue Runtime Determinism

on:
  push:
    branches:
      - agent/albion-idle-development

jobs:
  deterministic-blue-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build gameplay dependencies
        run: pnpm --filter @game/gameplay... build

      - name: Run Blue runtime twice and compare outputs
        run: pnpm exec tsx scripts/runtime-blue-deterministic-check.ts
