name: tmp-dungeon-contract-audit
on:
  push:
    branches: [agent/albion-idle-development]
    paths:
      - '.github/workflows/tmp-dungeon-contract-audit.yml'
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Final Keeper margin probes
        shell: bash
        run: |
          set -e
          cp apps/client/src/data/dungeonContentCatalog.ts /tmp/orig.ts
          patch_hp() {
            DID="$1" HP="$2" python - <<'PY'
          from pathlib import Path
          import os,re
          p=Path('apps/client/src/data/dungeonContentCatalog.ts'); s=p.read_text(); did=os.environ['DID']
          m=re.search(rf'(\[{did}\]: \[\n)(.*?)(\n  \],)',s,re.S); rows=m.group(2).split('\n')
          rows[-1]=re.sub(r'hp: [0-9.]+',f"hp: {os.environ['HP']}",rows[-1])
          p.write_text(s[:m.start()]+m.group(1)+'\n'.join(rows)+m.group(3)+s[m.end():])
          PY
          }
          run_keeper() {
            LABEL="$1" TIER="$2"
            echo "===== $LABEL ====="
            pnpm benchmark:dungeons > /tmp/out.txt
            awk "/\\[DUNGEON_T${TIER}_BASE_MATRIX\\]/{p=1;next}/\\[DUNGEON_T${TIER}_BASE_SUMMARY\\]/{p=0} p&&/dungeon_keeper_t${TIER}/{print}" /tmp/out.txt
          }
          for hp in 1.21 1.22 1.23 1.24; do
            cp /tmp/orig.ts apps/client/src/data/dungeonContentCatalog.ts
            patch_hp KEEPER_T6_DUNGEON_ID "$hp"
            run_keeper "T6 Keeper hp=$hp" 6
          done
          for hp in 1.62 1.63 1.64; do
            cp /tmp/orig.ts apps/client/src/data/dungeonContentCatalog.ts
            patch_hp KEEPER_T7_DUNGEON_ID "$hp"
            run_keeper "T7 Keeper hp=$hp" 7
          done
