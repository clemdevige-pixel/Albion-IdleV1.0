name: tmp-dungeon-contract-audit
on:
  push:
    branches: [agent/albion-idle-development]
    paths:
      - '.github/workflows/tmp-dungeon-contract-audit.yml'
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Heretic T5 encounter-pressure grid
        shell: bash
        run: |
          set -e
          cp apps/client/src/data/dungeonContentCatalog.ts /tmp/dungeon.orig.ts
          run_case() {
            label="$1"; e1="$2"; e2="$3"; e3="$4"; boss="$5"
            cp /tmp/dungeon.orig.ts apps/client/src/data/dungeonContentCatalog.ts
            E1="$e1" E2="$e2" E3="$e3" BOSS="$boss" python - <<'PY'
          from pathlib import Path
          import os,re
          p=Path('apps/client/src/data/dungeonContentCatalog.ts'); s=p.read_text(); did='HERETIC_T5_DUNGEON_ID'
          pat=rf'(\[{did}\]: \[\n)(.*?)(\n  \],)'; m=re.search(pat,s,re.S); rows=m.group(2).split('\n')
          scales=[float(os.environ['E1']),float(os.environ['E2']),float(os.environ['E3'])]
          for i,scale in enumerate(scales):
              rows[i]=re.sub(r'damage: ([0-9.]+)', lambda x,scale=scale: f"damage: {round(float(x.group(1))*scale,5)}", rows[i])
          rows[-1]=re.sub(r'hp: [0-9.]+', 'hp: 0.75', rows[-1])
          rows[-1]=re.sub(r'damage: [0-9.]+', f"damage: {os.environ['BOSS']}", rows[-1])
          rows[-1]=re.sub(r'defense: [0-9.]+', 'defense: 1.10', rows[-1])
          body='\n'.join(rows); p.write_text(s[:m.start()]+m.group(1)+body+m.group(3)+s[m.end():])
          PY
            echo "===== $label e1=$e1 e2=$e2 e3=$e3 boss=$boss ====="
            pnpm benchmark:dungeons > /tmp/out.txt
            awk '/\[DUNGEON_T5_BASE_MATRIX\]/{p=1;next}/\[DUNGEON_T5_BASE_SUMMARY\]/{p=0} p&&/dungeon_heretic_t5/{print}' /tmp/out.txt
            echo FAVORABLE
            awk '/\[DUNGEON_T5_COUNTER_FACTION_MATRIX\]/{p=1;next}/\[DUNGEON_T5_COUNTER_FACTION_SUMMARY\]/{p=0} p&&/dungeon_heretic_t5/{print}' /tmp/out.txt
          }
          run_case E1 1.10 1.00 1.00 1.50
          run_case E2 1.00 1.10 1.00 1.50
          run_case E3 1.00 1.00 1.10 1.50
          run_case E4 1.00 1.00 1.15 1.50
          run_case E5 1.05 1.00 1.10 1.50
          run_case E6 1.00 1.05 1.10 1.50
          run_case E7 1.00 1.00 1.10 1.55
          run_case E8 1.05 1.05 1.10 1.50
