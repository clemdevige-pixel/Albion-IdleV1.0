name: tmp-dungeon-contract-audit
on:
  push:
    branches: [agent/albion-idle-development]
    paths:
      - '.github/workflows/tmp-dungeon-contract-audit.yml'
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Grid T5 Heretic and Morgana
        shell: bash
        run: |
          set -e
          cp apps/client/src/data/dungeonContentCatalog.ts /tmp/dungeon.orig.ts
          run_case() {
            label="$1"; did="$2"; hp="$3"; dmg="$4"
            cp /tmp/dungeon.orig.ts apps/client/src/data/dungeonContentCatalog.ts
            DID="$did" HP="$hp" DMG="$dmg" python - <<'PY'
          from pathlib import Path
          import os,re
          p=Path('apps/client/src/data/dungeonContentCatalog.ts')
          s=p.read_text(); did=os.environ['DID']; hp=os.environ['HP']; dmg=os.environ['DMG']
          pat=rf'(\[{did}\]: \[\n)(.*?)(\n  \],)'
          m=re.search(pat,s,re.S)
          if not m: raise SystemExit(f'missing {did}')
          rows=m.group(2).split('\n')
          rows[-1]=re.sub(r'hp: [0-9.]+', f'hp: {hp}', rows[-1])
          rows[-1]=re.sub(r'damage: [0-9.]+', f'damage: {dmg}', rows[-1])
          body='\n'.join(rows)
          p.write_text(s[:m.start()]+m.group(1)+body+m.group(3)+s[m.end():])
          PY
            echo "===== $label ====="
            pnpm benchmark:dungeons 2>&1 | awk -v target="dungeon_${did,,}" '/DUNGEON_T5_BASE_SUMMARY/{b=1;c=0} /DUNGEON_T5_COUNTER_FACTION_SUMMARY/{f=1;c2=0} b{if(index($0,target)){print "BASE " $0;b=0}} f{if(index($0,target)){print "FAV  " $0;f=0}}'
          }
          run_case H1 HERETIC_T5_DUNGEON_ID 1.02 1.20
          run_case H2 HERETIC_T5_DUNGEON_ID 1.02 1.24
          run_case H3 HERETIC_T5_DUNGEON_ID 0.90 1.35
          run_case H4 HERETIC_T5_DUNGEON_ID 0.84 1.40
          run_case H5 HERETIC_T5_DUNGEON_ID 0.78 1.45
          run_case M1 MORGANA_T5_DUNGEON_ID 1.02 1.20
          run_case M2 MORGANA_T5_DUNGEON_ID 0.90 1.30
          run_case M3 MORGANA_T5_DUNGEON_ID 0.84 1.35
          run_case M4 MORGANA_T5_DUNGEON_ID 0.78 1.40
          run_case M5 MORGANA_T5_DUNGEON_ID 0.72 1.45
