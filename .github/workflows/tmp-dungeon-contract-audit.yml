name: tmp-dungeon-contract-audit
on:
  push:
    branches: [agent/albion-idle-development]
    paths:
      - '.github/workflows/tmp-dungeon-contract-audit.yml'
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Current dungeon contract telemetry
        shell: bash
        run: |
          pnpm benchmark:dungeons > /tmp/out.txt
          for tier in 4 5 6 7 8; do
            echo "===== T${tier} BASE ====="
            awk "/\\[DUNGEON_T${tier}_BASE_MATRIX\\]/{p=1;next}/\\[DUNGEON_T${tier}_BASE_SUMMARY\\]/{p=0} p" /tmp/out.txt
            echo "===== T${tier} FAVORABLE ====="
            awk "/\\[DUNGEON_T${tier}_COUNTER_FACTION_MATRIX\\]/{p=1;next}/\\[DUNGEON_T${tier}_COUNTER_FACTION_SUMMARY\\]/{p=0} p" /tmp/out.txt
          done
