name: tmp-dungeon-contract-audit
on:
  push:
    branches: [agent/albion-idle-development]
    paths:
      - '.github/workflows/tmp-dungeon-contract-audit.yml'
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Heretic T5 final threshold grid
        shell: bash
        run: |
          set -e
          cp apps/client/src/data/dungeonContentCatalog.ts /tmp/dungeon.orig.ts
          run_case() {
            label="$1"; hp="$2"; def="$3"
            cp /tmp/dungeon.orig.ts apps/client/src/data/dungeonContentCatalog.ts
            HP="$hp" DEF="$def" python - <<'PY'
          from pathlib import Path
          import os,re
          p=Path('apps/client/src/data/dungeonContentCatalog.ts'); s=p.read_text(); did='HERETIC_T5_DUNGEON_ID'
          pat=rf'(\[{did}\]: \[\n)(.*?)(\n  \],)'; m=re.search(pat,s,re.S); rows=m.group(2).split('\n')
          rows[-1]=re.sub(r'hp: [0-9.]+', f"hp: {os.environ['HP']}", rows[-1])
          rows[-1]=re.sub(r'damage: [0-9.]+', 'damage: 1.50', rows[-1])
          rows[-1]=re.sub(r'defense: [0-9.]+', f"defense: {os.environ['DEF']}", rows[-1])
          for i in range(3):
              rows[i]=re.sub(r'damage: ([0-9.]+)', lambda x: f"damage: {round(float(x.group(1))*1.05,5)}", rows[i])
          body='\n'.join(rows); p.write_text(s[:m.start()]+m.group(1)+body+m.group(3)+s[m.end():])
          PY
            echo "===== $label hp=$hp def=$def ====="
            pnpm benchmark:dungeons > /tmp/out.txt
            awk '/\[DUNGEON_T5_BASE_MATRIX\]/{p=1;next}/\[DUNGEON_T5_BASE_SUMMARY\]/{p=0} p&&/dungeon_heretic_t5/{print}' /tmp/out.txt
            echo FAVORABLE
            awk '/\[DUNGEON_T5_COUNTER_FACTION_MATRIX\]/{p=1;next}/\[DUNGEON_T5_COUNTER_FACTION_SUMMARY\]/{p=0} p&&/dungeon_heretic_t5/{print}' /tmp/out.txt
          }
          run_case F1 0.72 1.12
          run_case F2 0.72 1.14
          run_case F3 0.72 1.16
          run_case F4 0.73 1.10
          run_case F5 0.74 1.10
          run_case F6 0.75 1.10
