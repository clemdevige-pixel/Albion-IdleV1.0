name: tmp-dungeon-contract-audit
on:
  push:
    branches: [agent/albion-idle-development]
    paths:
      - '.github/workflows/tmp-dungeon-contract-audit.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/albion-idle-development
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Apply validated dungeon contract values
        shell: bash
        run: |
          set -e
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('apps/client/src/data/dungeonContentCatalog.ts')
          s = p.read_text()

          def patch(did, row, hp=None, damage=None):
              global s
              m = re.search(rf'(\[{did}\]: \[\n)(.*?)(\n  \],)', s, re.S)
              if not m:
                  raise SystemExit(f'missing dungeon block: {did}')
              rows = m.group(2).split('\n')
              if hp is not None:
                  rows[row] = re.sub(r'hp: [0-9.]+', f'hp: {hp}', rows[row])
              if damage is not None:
                  rows[row] = re.sub(r'damage: [0-9.]+', f'damage: {damage}', rows[row])
              s = s[:m.start()] + m.group(1) + '\n'.join(rows) + m.group(3) + s[m.end():]

          patch('HERETIC_T5_DUNGEON_ID', 2, damage='1.21')
          patch('HERETIC_T5_DUNGEON_ID', 3, hp='0.75', damage='1.68')
          patch('UNDEAD_T5_DUNGEON_ID', 3, damage='1.18')
          patch('MORGANA_T5_DUNGEON_ID', 3, hp='0.85', damage='1.30')
          patch('KEEPER_T6_DUNGEON_ID', 3, hp='1.21')
          patch('KEEPER_T7_DUNGEON_ID', 3, hp='1.63')
          patch('KEEPER_T8_DUNGEON_ID', 3, hp='1.00')
          p.write_text(s)
          PY
          pnpm benchmark:dungeons > /tmp/dungeons.txt
          grep -q "'dungeon_keeper_t8'.*'5/5'" /tmp/dungeons.txt
          grep -q "'dungeon_morgana_t8'.*'5/5'" /tmp/dungeons.txt
      - name: Commit live calibration
        shell: bash
        run: |
          git config user.name "Kowzil"
          git config user.email "clem.devige@gmail.com"
          git add apps/client/src/data/dungeonContentCatalog.ts
          git commit -m "balance(dungeons): enforce T4-T8 progression contract"
          git push origin HEAD:agent/albion-idle-development
