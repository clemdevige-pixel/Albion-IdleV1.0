name: tmp-dungeon-contract-audit
on:
  push:
    branches: [agent/albion-idle-development]
    paths:
      - '.github/workflows/tmp-dungeon-contract-audit.yml'
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Final Heretic T5 grid
        shell: bash
        run: |
          set -e
          cp apps/client/src/data/dungeonContentCatalog.ts /tmp/dungeon.orig.ts
          run_case() {
            label="$1"; hp="$2"; dmg="$3"; def="$4"
            cp /tmp/dungeon.orig.ts apps/client/src/data/dungeonContentCatalog.ts
            HP="$hp" DMG="$dmg" DEF="$def" python - <<'PY'
          from pathlib import Path
          import os,re
          p=Path('apps/client/src/data/dungeonContentCatalog.ts'); s=p.read_text()
          did='HERETIC_T5_DUNGEON_ID'; hp=os.environ['HP']; dmg=os.environ['DMG']; de=os.environ['DEF']
          pat=rf'(\[{did}\]: \[\n)(.*?)(\n  \],)'; m=re.search(pat,s,re.S)
          rows=m.group(2).split('\n')
          rows[-1]=re.sub(r'hp: [0-9.]+', f'hp: {hp}', rows[-1])
          rows[-1]=re.sub(r'damage: [0-9.]+', f'damage: {dmg}', rows[-1])
          rows[-1]=re.sub(r'defense: [0-9.]+', f'defense: {de}', rows[-1])
          body='\n'.join(rows); p.write_text(s[:m.start()]+m.group(1)+body+m.group(3)+s[m.end():])
          PY
            echo "===== $label hp=$hp dmg=$dmg def=$def ====="
            pnpm benchmark:dungeons 2>&1 | awk '/DUNGEON_T5_BASE_SUMMARY/{b=1} /DUNGEON_T5_COUNTER_FACTION_SUMMARY/{f=1} b&&/dungeon_heretic_t5/{print "BASE " $0;b=0} f&&/dungeon_heretic_t5/{print "FAV  " $0;f=0}'
          }
          run_case H6 0.72 1.50 1.10
          run_case H7 0.66 1.55 1.10
          run_case H8 0.60 1.60 1.10
          run_case H9 0.90 1.28 1.18
          run_case H10 0.82 1.34 1.18
          run_case H11 0.74 1.42 1.18
          run_case H12 0.90 1.24 1.26
          run_case H13 0.80 1.32 1.26
