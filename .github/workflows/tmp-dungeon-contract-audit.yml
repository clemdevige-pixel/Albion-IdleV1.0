name: tmp-dungeon-contract-audit
on:
  push:
    branches: [agent/albion-idle-development]
    paths:
      - '.github/workflows/tmp-dungeon-contract-audit.yml'
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Heretic T5 final boss threshold
        shell: bash
        run: |
          set -e
          cp apps/client/src/data/dungeonContentCatalog.ts /tmp/orig.ts
          for boss in 1.67 1.68 1.69; do
            cp /tmp/orig.ts apps/client/src/data/dungeonContentCatalog.ts
            BOSS="$boss" python - <<'PY'
          from pathlib import Path
          import os,re
          p=Path('apps/client/src/data/dungeonContentCatalog.ts'); s=p.read_text(); did='HERETIC_T5_DUNGEON_ID'
          m=re.search(rf'(\[{did}\]: \[\n)(.*?)(\n  \],)',s,re.S); rows=m.group(2).split('\n')
          rows[2]=re.sub(r'damage: ([0-9.]+)',lambda x:f"damage: {round(float(x.group(1))*1.10,5)}",rows[2])
          rows[-1]=re.sub(r'hp: [0-9.]+','hp: 0.75',rows[-1])
          rows[-1]=re.sub(r'damage: [0-9.]+',f"damage: {os.environ['BOSS']}",rows[-1])
          body='\n'.join(rows); p.write_text(s[:m.start()]+m.group(1)+body+m.group(3)+s[m.end():])
          PY
            echo "===== boss=$boss ====="
            pnpm benchmark:dungeons > /tmp/out.txt
            awk '/\[DUNGEON_T5_BASE_MATRIX\]/{p=1;next}/\[DUNGEON_T5_BASE_SUMMARY\]/{p=0} p&&/dungeon_heretic_t5/{print}' /tmp/out.txt
            echo FAVORABLE
            awk '/\[DUNGEON_T5_COUNTER_FACTION_MATRIX\]/{p=1;next}/\[DUNGEON_T5_COUNTER_FACTION_SUMMARY\]/{p=0} p&&/dungeon_heretic_t5/{print}' /tmp/out.txt
          done
