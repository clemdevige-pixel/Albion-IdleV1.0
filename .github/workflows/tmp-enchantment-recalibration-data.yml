name: Temporary Enchantment Recalibration Data

on:
  pull_request:
    branches:
      - agent/albion-idle-development

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enable Corepack
        run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build workspace packages
        run: pnpm exec tsc -b
      - name: Run enchantment shard TTK benchmark
        run: pnpm --filter @game/client test -- enchantmentShardTtkBenchmark.test.ts --reporter=verbose
