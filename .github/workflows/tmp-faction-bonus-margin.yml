name: tmp-faction-bonus-margin
on:
  push:
    branches: [agent/albion-idle-development]
    paths:
      - '.github/workflows/tmp-faction-bonus-margin.yml'
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Probe authored faction advantage bonus
        shell: bash
        run: |
          cp apps/client/src/data/factionArtifactWeaponContent.ts /tmp/faction.ts
          for bonus in 22 25 27 30 35; do
            cp /tmp/faction.ts apps/client/src/data/factionArtifactWeaponContent.ts
            BONUS="$bonus" python - <<'PY'
          from pathlib import Path
          import os,re
          p=Path('apps/client/src/data/factionArtifactWeaponContent.ts')
          s=p.read_text(); b=int(os.environ['BONUS'])
          s=re.sub(r'FACTION_ARTIFACT_MATCHUP_DAMAGE_BONUS_PERCENT = \d+;',f'FACTION_ARTIFACT_MATCHUP_DAMAGE_BONUS_PERCENT = {b};',s)
          p.write_text(s)
          PY
            echo "===== BONUS ${bonus}% ====="
            pnpm benchmark:dungeons > /tmp/out.txt
            for tier in 4 5 6 7 8; do
              echo "--- T${tier} ---"
              awk "/\\[DUNGEON_T${tier}_COUNTER_FACTION_SUMMARY\\]/{p=1;next}/^$/{if(p){exit}} p" /tmp/out.txt
            done
          done
          cp /tmp/faction.ts apps/client/src/data/factionArtifactWeaponContent.ts
