name: tmp-shard-calc
on:
  push:
    branches: [agent/albion-idle-development]
    paths:
      - '.github/workflows/tmp-shard-calc.yml'
jobs:
  calc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run shard benchmark
        run: pnpm benchmark:enchantment-shards
