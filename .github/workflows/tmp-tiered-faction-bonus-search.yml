name: tmp-tiered-faction-bonus-search
on:
  push:
    branches: [agent/albion-idle-development]
    paths:
      - '.github/workflows/tmp-tiered-faction-bonus-search.yml'
jobs:
  search:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Extend favorable bonus search and identify bottlenecks
        shell: bash
        run: |
          set -e
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/runtime-dungeon-benchmark.ts')
          s=p.read_text()
          s=s.replace('const FAVORABLE_FACTION_BONUS_PCT = FACTION_ARTIFACT_DAMAGE_BONUS_PERCENT;\nconst FAVORABLE_FACTION_DAMAGE_MULTIPLIER = 1 + FAVORABLE_FACTION_BONUS_PCT / 100;', 'const FAVORABLE_FACTION_BONUS_PCT = Number(process.env.DUNGEON_BONUS_PCT ?? FACTION_ARTIFACT_DAMAGE_BONUS_PERCENT);\nconst FAVORABLE_FACTION_DAMAGE_MULTIPLIER = 1 + FAVORABLE_FACTION_BONUS_PCT / 100;')
          s=s.replace('.filter(({ itemId }) => resolveArtifactDungeonDamageBonusPercent(itemId, dungeon.faction) === FAVORABLE_FACTION_BONUS_PCT)', '.filter(({ itemId }) => resolveArtifactDungeonDamageBonusPercent(itemId, dungeon.faction) > 0)')
          p.write_text(s)
          PY

          rm -f /tmp/results.tsv
          printf 'bonus\ttier\tminHp\tallClear\tbottleneckDungeon\n' > /tmp/results.tsv
          for bonus in $(seq 35 45); do
            echo "===== BONUS ${bonus}% ====="
            DUNGEON_BONUS_PCT=$bonus pnpm benchmark:dungeons > /tmp/out.txt
            node - "$bonus" /tmp/out.txt >> /tmp/results.tsv <<'NODE'
          const fs=require('fs');
          const bonus=Number(process.argv[2]);
          const text=fs.readFileSync(process.argv[3],'utf8');
          for(const tier of [4,5,6,7,8]){
            const start=text.indexOf(`[DUNGEON_T${tier}_COUNTER_FACTION_SUMMARY]`);
            const nextTier=text.indexOf(`[DUNGEON_T${tier+1}_REFERENCE]`, start);
            const chunk=text.slice(start, nextTier === -1 ? text.length : nextTier);
            const rows=[];
            for(const line of chunk.split('\n')){
              if(!line.includes('dungeon_') || !line.includes('│')) continue;
              const cells=line.split('│').map(x=>x.trim()).filter(Boolean);
              if(cells.length < 9) continue;
              rows.push({dungeon:String(cells[1]).replaceAll("'",''),clearCount:String(cells[4]).replaceAll("'",''),hp:Number(cells[5])});
            }
            const allClear=rows.length===4 && rows.every(r=>r.clearCount==='5/5');
            const bottleneck=rows.length===4 ? [...rows].sort((a,b)=>a.hp-b.hp)[0] : null;
            console.log(`${bonus}\t${tier}\t${bottleneck?.hp ?? -1}\t${allClear}\t${bottleneck?.dungeon ?? 'missing'}`);
          }
          NODE
          done
          cat /tmp/results.tsv
          echo '===== FIRST >=10 / >=15 IN EXTENDED RANGE ====='
          node <<'NODE'
          const fs=require('fs');
          const rows=fs.readFileSync('/tmp/results.tsv','utf8').trim().split('\n').slice(1).map(l=>{const [bonus,tier,minHp,allClear,bottleneckDungeon]=l.split('\t'); return {bonus:+bonus,tier:+tier,minHp:+minHp,allClear:allClear==='true',bottleneckDungeon};});
          for(const tier of [4,5,6,7,8]){
            const rs=rows.filter(r=>r.tier===tier);
            console.log({tier,firstAtLeast10:rs.find(r=>r.allClear&&r.minHp>=10)??null,firstAtLeast15:rs.find(r=>r.allClear&&r.minHp>=15)??null});
          }
          NODE
          for bonus in 36 38 40; do
            echo "===== DETAIL ${bonus}% T5/T8 ====="
            DUNGEON_BONUS_PCT=$bonus pnpm benchmark:dungeons > /tmp/detail.txt
            awk '/\[DUNGEON_T5_COUNTER_FACTION_SUMMARY\]/{p=1;next}/\[DUNGEON_T6_REFERENCE\]/{p=0}p' /tmp/detail.txt
            awk '/\[DUNGEON_T8_COUNTER_FACTION_SUMMARY\]/{p=1;next}p' /tmp/detail.txt
          done
